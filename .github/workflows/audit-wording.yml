name: Audit wording (hebdo)

# GitHub Actions n'est QUE le chef d'orchestre : il reveille la machine chaque
# lundi, lance audit.py, et c'est l'appel OpenRouter (dans le script) qui juge le ton.
on:
  schedule:
    - cron: '0 8 * * 1' # tous les lundis a 08:00 UTC
  workflow_dispatch: {} # + bouton "Run workflow" pour tester a la demande

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    # LanguageTool self-hoste -> pas de rate-limit du tier gratuit pendant le crawl.
    services:
      languagetool:
        image: erikvl87/languagetool:latest
        ports:
          - 8010:8010

    env:
      LANGUAGETOOL_URL: http://localhost:8010/v2/check
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-sonnet-4.6' }}
      # Slack via bot token (DSN style Symfony Notifier, reutilise celui de lagrange).
      SLACK_DSN: ${{ secrets.SLACK_DSN }}
      SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL || 'test-automatisation' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Restaure l'etat du run precedent -> permet le delta (ne signaler que le nouveau).
      # Best-effort : si le cache a expire, le run signale tout (degradation sure).
      - name: Restaure l'etat (delta)
        uses: actions/cache@v6
        with:
          path: audit/.state
          key: audit-state-${{ github.run_id }}
          restore-keys: |
            audit-state-

      - name: Attendre que LanguageTool soit pret
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:8010/v2/languages" >/dev/null; then
              echo "LanguageTool pret"; exit 0
            fi
            echo "attente LanguageTool ($i/30)..."; sleep 2
          done
          echo "LanguageTool indisponible -> ortho en mode degrade"; exit 0

      - name: Lancer l'audit
        run: python3 audit/audit.py --state-dir audit/.state
